name: CI
on:
  pull_request:
    branches: [main]
jobs:
  test:                       # keep this job name: the branch ruleset requires a check called "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4       # PySpark needs Java
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
